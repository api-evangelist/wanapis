naftiko: 1.0.0-alpha2
info:
  label: WanAPIs API — Audio
  description: 'WanAPIs API — Audio. 3 operations: text-to-speech, transcription, translation. OpenAI-compatible.'
  tags:
  - WanAPIs
  - Audio
  - Speech
  created: '2026-05-27'
  modified: '2026-05-27'
binds:
- namespace: env
  keys:
    WANAPIS_API_KEY: WANAPIS_API_KEY
capability:
  consumes:
  - type: http
    namespace: wanapis-audio
    baseUri: https://api.wanapis.com/v1
    description: WanAPIs API — Audio business capability.
    resources:
    - name: audio-speech
      path: /audio/speech
      operations:
      - name: createspeech
        method: POST
        description: Synthesize speech from text
        outputRawFormat: binary
        outputParameters:
        - name: result
          type: binary
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: audio-transcriptions
      path: /audio/transcriptions
      operations:
      - name: createtranscription
        method: POST
        description: Transcribe audio to text
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Multipart form (file, model, ...).
          required: true
    - name: audio-translations
      path: /audio/translations
      operations:
      - name: createtranslation
        method: POST
        description: Translate audio to English text
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Multipart form (file, model, ...).
          required: true
    authentication:
      type: bearer
      token: '{{env.WANAPIS_API_KEY}}'
  exposes:
  - type: rest
    namespace: wanapis-audio-rest
    port: 8080
    description: REST adapter for WanAPIs API — Audio.
    resources:
    - path: /v1/audio/speech
      name: audio-speech
      description: REST surface for text-to-speech.
      operations:
      - method: POST
        name: createspeech
        description: Synthesize speech
        call: wanapis-audio.createspeech
        with:
          body: rest.body
        outputParameters:
        - type: binary
          mapping: $.
    - path: /v1/audio/transcriptions
      name: audio-transcriptions
      description: REST surface for transcription.
      operations:
      - method: POST
        name: createtranscription
        description: Transcribe audio
        call: wanapis-audio.createtranscription
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/audio/translations
      name: audio-translations
      description: REST surface for translation.
      operations:
      - method: POST
        name: createtranslation
        description: Translate audio
        call: wanapis-audio.createtranslation
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: wanapis-audio-mcp
    port: 9090
    transport: http
    description: MCP adapter for WanAPIs API — Audio.
    tools:
    - name: create-speech
      description: Synthesize speech from text
      hints: { readOnly: false, destructive: false, idempotent: false }
      call: wanapis-audio.createspeech
      with: { body: tools.body }
      outputParameters:
      - type: binary
        mapping: $.
    - name: create-transcription
      description: Transcribe audio to text
      hints: { readOnly: true, destructive: false, idempotent: true }
      call: wanapis-audio.createtranscription
      with: { body: tools.body }
      outputParameters:
      - type: object
        mapping: $.
    - name: create-translation
      description: Translate audio to English
      hints: { readOnly: true, destructive: false, idempotent: true }
      call: wanapis-audio.createtranslation
      with: { body: tools.body }
      outputParameters:
      - type: object
        mapping: $.
