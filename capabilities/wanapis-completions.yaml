naftiko: 1.0.0-alpha2
info:
  label: WanAPIs API — Completions
  description: 'WanAPIs API — Completions. 1 operation. Legacy OpenAI-compatible text completions surface.'
  tags:
  - WanAPIs
  - Completions
  - OpenAI Compatible
  created: '2026-05-27'
  modified: '2026-05-27'
binds:
- namespace: env
  keys:
    WANAPIS_API_KEY: WANAPIS_API_KEY
capability:
  consumes:
  - type: http
    namespace: wanapis-completions
    baseUri: https://api.wanapis.com/v1
    description: WanAPIs API — Completions business capability.
    resources:
    - name: completions
      path: /completions
      operations:
      - name: createcompletion
        method: POST
        description: Create text completion
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.WANAPIS_API_KEY}}'
  exposes:
  - type: rest
    namespace: wanapis-completions-rest
    port: 8080
    description: REST adapter for WanAPIs API — Completions.
    resources:
    - path: /v1/completions
      name: completions
      description: REST surface for completions.
      operations:
      - method: POST
        name: createcompletion
        description: Create text completion
        call: wanapis-completions.createcompletion
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: wanapis-completions-mcp
    port: 9090
    transport: http
    description: MCP adapter for WanAPIs API — Completions.
    tools:
    - name: create-completion
      description: Create text completion
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: wanapis-completions.createcompletion
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
