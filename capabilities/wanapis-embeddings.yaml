naftiko: 1.0.0-alpha2
info:
  label: WanAPIs API — Embeddings
  description: 'WanAPIs API — Embeddings. 1 operation. OpenAI-compatible vector embeddings.'
  tags:
  - WanAPIs
  - Embeddings
  - OpenAI Compatible
  created: '2026-05-27'
  modified: '2026-05-27'
binds:
- namespace: env
  keys:
    WANAPIS_API_KEY: WANAPIS_API_KEY
capability:
  consumes:
  - type: http
    namespace: wanapis-embeddings
    baseUri: https://api.wanapis.com/v1
    description: WanAPIs API — Embeddings business capability.
    resources:
    - name: embeddings
      path: /embeddings
      operations:
      - name: createembedding
        method: POST
        description: Create embeddings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.WANAPIS_API_KEY}}'
  exposes:
  - type: rest
    namespace: wanapis-embeddings-rest
    port: 8080
    description: REST adapter for WanAPIs API — Embeddings.
    resources:
    - path: /v1/embeddings
      name: embeddings
      description: REST surface for embeddings.
      operations:
      - method: POST
        name: createembedding
        description: Create embeddings
        call: wanapis-embeddings.createembedding
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: wanapis-embeddings-mcp
    port: 9090
    transport: http
    description: MCP adapter for WanAPIs API — Embeddings.
    tools:
    - name: create-embedding
      description: Create embeddings
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: wanapis-embeddings.createembedding
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
