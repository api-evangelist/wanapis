specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: WanAPIs
providerId: wanapis
created: '2026-05-27'
modified: '2026-05-27'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - AI Model Aggregation
  - Pay As You Go
description: |
  FOCUS-aligned FinOps view of WanAPIs. WanAPIs operates as a pay-as-you-go
  AI model marketplace: customers pre-fund a USD (or ¥) balance, then
  consume per-model tokens at per-model rates. Costs are metered per request
  and aggregated against per-project quotas. Because per-model rates are
  dynamic and WanAPIs has not (yet) published a programmatic billing export
  in this analysis, the document is marked `reconciled: false`.
sources:
  - https://wanapis.com/pricing
  - https://wanapis.com/model
  - https://wanapis.com/docs
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: WanAPIs
serviceCategory: AI Model Aggregation
billingModel:
  pricingCategory: Pay-As-You-Go (Per-Model Token Metering)
  billingFrequency: Continuous (against prepaid balance)
  billingCurrency: USD
  alternateCurrency: CNY
  conversion: '¥1 = $1 quota at 1:1; $1 = 500,000 internal quota units'
focusColumns:
  ServiceName: WanAPIs Unified AI API
  ServiceCategory: AI Model Aggregation
  ProviderName: WanAPIs
  PublisherName: WanAPIs
  BillingCurrency: USD
  ChargeCategory: Usage
  ChargeFrequency: Per Request
  PricingUnit: Token
meters:
  - name: input_tokens
    unit: token
    aggregation: sum
    dimensions: [model, provider, project, channel]
  - name: output_tokens
    unit: token
    aggregation: sum
    dimensions: [model, provider, project, channel]
  - name: cache_hit_tokens
    unit: token
    aggregation: sum
    dimensions: [model, project]
    description: Tokens served from prompt/result cache; typically billed at reduced or zero rate.
  - name: image_units
    unit: image
    aggregation: sum
    dimensions: [model, size, quality, project]
  - name: audio_seconds
    unit: second
    aggregation: sum
    dimensions: [model, project]
  - name: balance_topup
    unit: USD
    aggregation: sum
    dimensions: [account]
  - name: request_count
    unit: request
    aggregation: count
    dimensions: [model, project, status_code]
costFormula: 'cost = (input_tokens * input_price * model_ratio) + (output_tokens * output_price * completion_ratio)'
principles:
  - name: Visibility
    description: Use the WanAPIs dashboard request logs and per-project metering to attribute every token to a model, channel, and project.
  - name: Allocation
    description: Tag each project to a team or cost center; gate model availability per project to control blast radius.
  - name: Optimization
    description: Route low-stakes traffic to cheap models (DeepSeek, Haiku) and reserve premium models (Opus, GPT-5.5) for high-value calls; lean on cache_hit_tokens.
  - name: Accountability
    description: Set per-project quotas and balance alerts; review per-model spend weekly; audit failover events for unexpected channel cost.
