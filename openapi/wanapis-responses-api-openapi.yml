openapi: 3.2.0
info:
  title: WanAPIs Unified AI Responses API
  version: '2026-05-27'
  summary: OpenAI-compatible AI gateway aggregating GPT, Claude, Gemini, DeepSeek and other LLM, image, video, and audio model providers behind a single key.
  description: WanAPIs (https://wanapis.com) is a developer-focused AI API gateway.
  termsOfService: https://wanapis.com/
  contact:
    name: WanAPIs Support
    email: support@wanapis.com
    url: https://wanapis.com/
  license:
    name: Proprietary
    url: https://wanapis.com/
servers:
- url: https://api.wanapis.com/v1
  description: WanAPIs production OpenAI-compatible base URL.
security:
- bearerAuth: []
tags:
- name: Responses
  description: WanAPIs Responses API for structured, multi-step model workflows.
paths:
  /responses:
    post:
      tags:
      - Responses
      operationId: createResponse
      summary: Create a Response (WanAPIs Responses API)
      description: 'WanAPIs-native Responses endpoint for structured, multi-step workflows.

        Compatible with the OpenAI Responses API. Accepts an `input` string or

        message array plus optional tool configuration.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponseRequest'
            examples:
              gpt:
                summary: Diagnose a log
                value:
                  model: gpt-5.5
                  input: 分析这段日志并给出排障步骤
      responses:
        '200':
          description: Response object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/UpstreamFailure'
components:
  schemas:
    ResponseRequest:
      type: object
      required:
      - model
      - input
      properties:
        model:
          type: string
        input:
          oneOf:
          - type: string
          - type: array
            items:
              type: object
        instructions:
          type: string
        tools:
          type: array
          items:
            type: object
        stream:
          type: boolean
          default: false
        metadata:
          type: object
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string
            param:
              type: string
              nullable: true
    Usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
    ResponseObject:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          const: response
        created:
          type: integer
        model:
          type: string
        output:
          type: array
          items:
            type: object
        usage:
          $ref: '#/components/schemas/Usage'
  responses:
    RateLimited:
      description: Rate limit or quota exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpstreamFailure:
      description: Upstream provider failure (500–504). Retry with exponential backoff; WanAPIs may auto-failover to a configured channel.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: 'Authenticate every request with `Authorization: Bearer <wanapis_api_key>`.

        Keys are issued per project in the WanAPIs dashboard and may be scoped

        with quota and model availability.

        '
